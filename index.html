<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>運算思維</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap">
<link rel="stylesheet" href="play/css/style.css?v=4">
</head>
<body>
<div class="wrap">
  <p class="backhome">校園資訊課 · 原創練習</p>
  <h1>運算思維</h1>
  <p class="hint">用 Google 登入後，關卡進度與測驗分數記在這個帳號。十二關都完成，才開放線上測驗。</p>
  <div id="gsiArea" class="gsi"></div>
  <div class="maphead"><h2>十二關</h2><a href="play/">進入關卡</a></div>
  <div class="grid" id="toc"></div>
  <p class="hint">完成一關才解開下一關。十二關都完成後，關卡頁最下方才出現線上測驗。</p>
  <div class="warn">題目是依 114 學年封存課堂「運算思維」作業所附題庫的詳解寫法另寫的校園情境，不是競賽歷屆原題，也不能代替正式測驗。</div>
  <footer>文件供課堂使用。請勿把競賽題庫原文貼上公開頁面。</footer>
</div>
<script>window.REVIEW_DATA = { module: "ct", title: "運算思維" };</script>
<script src="play/js/levels.js"></script>
<script>
(function () {
  var root = document.getElementById("toc");
  if (!root || !window.CT_LEVELS) return;
  root.innerHTML = CT_LEVELS.map(function (lv) {
    return '<a class="cell open" href="play/#/' + lv.slug + '">' +
      '<span class="code">' + lv.code + '</span>' +
      '<span class="nm">' + lv.nm + '</span>' +
      '<span class="goal">' + lv.en + '</span></a>';
  }).join("");
})();
</script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="js/google-auth-config.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/student-auth.js"></script>
<script src="js/cloud-sync.js"></script>
</body>
</html>
